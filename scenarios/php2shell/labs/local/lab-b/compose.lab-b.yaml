name: vulharness-php2shell-lab-b

services:
  web:
    image: nginx:1.30.6@sha256:42c68eab6f7e22611786a9fe1d1c019e275c50185bd54b8f75dc2b9184322703
    depends_on:
      - php-fpm
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - php2shell
      - loopback-access
    read_only: true
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=755
      - /var/run:uid=101,gid=101,mode=755
      - /tmp:uid=101,gid=101,mode=1777
    volumes:
      - type: bind
        source: ../lab-a/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ../lab-a/app
        target: /var/www/html
        read_only: true

  php-fpm:
    image: php:8.4.26-fpm-bookworm@sha256:845c7ba3487a47607f12cd35d09ac0e0880e8703f92a54ad517b69faef136072
    expose:
      - "9000"
    networks:
      - php2shell
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - NET_RAW
      - SETPCAP
    tmpfs:
      - /tmp
      - /var/run
    volumes:
      - type: bind
        source: ../lab-a/app
        target: /var/www/html
        read_only: true

networks:
  php2shell:
    driver: bridge
    internal: true
  loopback-access:
    driver: bridge

AWSTemplateFormatVersion: '2010-09-09'
Description: Independent VulHarness PHP2Shell Lab C/D infrastructure.

Parameters:
  DeploymentId:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]{0,31}$'
  ExpiresAt:
    Type: String
    AllowedPattern: '^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
  Owner:
    Type: String
    Default: workshop
    AllowedPattern: '^[A-Za-z0-9_.:/=+@-]{1,64}$'
  AmiId:
    Type: AWS::EC2::Image::Id
  VpcCidr:
    Type: String
    Default: 10.253.0.0/16
  SubnetCidr:
    Type: String
    Default: 10.253.1.0/24
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name

Mappings:
  Constants:
    Values:
      Project: VulHarness
      Scenario: php2shell
      Environment: aws-ec2
      Method: cloudformation

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: VulHarnessProject
          Value: !FindInMap [Constants, Values, Project]
        - Key: VulHarnessScenario
          Value: !FindInMap [Constants, Values, Scenario]
        - Key: VulHarnessEnvironment
          Value: !FindInMap [Constants, Values, Environment]
        - Key: VulHarnessDeployment
          Value: !Ref DeploymentId
        - Key: VulHarnessManagedBy
          Value: cloudformation
        - Key: VulHarnessDeploymentMethod
          Value: cloudformation
        - Key: VulHarnessOwner
          Value: !Ref Owner
        - Key: VulHarnessExpires
          Value: !Ref ExpiresAt
        - Key: VulHarnessResource
          Value: vpc
        - Key: Name
          Value: !Sub vulharness-php2shell-cloudformation-${DeploymentId}-vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref SubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true
      Tags:
        - Key: VulHarnessProject
          Value: !FindInMap [Constants, Values, Project]
        - Key: VulHarnessScenario
          Value: !FindInMap [Constants, Values, Scenario]
        - Key: VulHarnessEnvironment
          Value: !FindInMap [Constants, Values, Environment]
        - Key: VulHarnessDeployment
          Value: !Ref DeploymentId
        - Key: VulHarnessManagedBy
          Value: cloudformation
        - Key: VulHarnessDeploymentMethod
          Value: cloudformation
        - Key: VulHarnessOwner
          Value: !Ref Owner
        - Key: VulHarnessExpires
          Value: !Ref ExpiresAt
        - Key: VulHarnessResource
          Value: public-subnet
        - Key: Name
          Value: !Sub vulharness-php2shell-cloudformation-${DeploymentId}-public

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: VulHarnessProject
          Value: !FindInMap [Constants, Values, Project]
        - Key: VulHarnessScenario
          Value: !FindInMap [Constants, Values, Scenario]
        - Key: VulHarnessEnvironment
          Value: !FindInMap [Constants, Values, Environment]
        - Key: VulHarnessDeployment
          Value: !Ref DeploymentId
        - Key: VulHarnessManagedBy
          Value: cloudformation
        - Key: VulHarnessDeploymentMethod
          Value: cloudformation
        - Key: VulHarnessOwner
          Value: !Ref Owner
        - Key: VulHarnessExpires
          Value: !Ref ExpiresAt
        - Key: VulHarnessResource
          Value: internet-gateway
        - Key: Name
          Value: !Sub vulharness-php2shell-cloudformation-${DeploymentId}-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: VulHarnessProject
          Value: !FindInMap [Constants, Values, Project]
        - Key: VulHarnessScenario
          Value: !FindInMap [Constants, Values, Scenario]
        - Key: VulHarnessEnvironment
          Value: !FindInMap [Constants, Values, Environment]
        - Key: VulHarnessDeployment
          Value: !Ref DeploymentId
        - Key: VulHarnessManagedBy
          Value: cloudformation
        - Key: VulHarnessDeploymentMethod
          Value: cloudformation
        - Key: VulHarnessOwner
          Value: !Ref Owner
        - Key: VulHarnessExpires
          Value: !Ref ExpiresAt
        - Key: VulHarnessResource
          Value: route-table
        - Key: Name
          Value: !Sub vulharness-php2shell-cloudformation-${DeploymentId}-public-route

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound access for VulHarness PHP2Shell lab
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: VulHarnessProject
          Value: !FindInMap [Constants, Values, Project]
        - Key: VulHarnessScenario
          Value: !FindInMap [Constants, Values, Scenario]
        - Key: VulHarnessEnvironment
          Value: !FindInMap [Constants, Values, Environment]
        - Key: VulHarnessDeployment
          Value: !Ref DeploymentId
        - Key: VulHarnessManagedBy
          Value: cloudformation
        - Key: VulHarnessDeploymentMethod
          Value: cloudformation
        - Key: VulHarnessOwner
          Value: !Ref Owner
        - Key: VulHarnessExpires
          Value: !Ref ExpiresAt
        - Key: VulHarnessResource
          Value: security-group
        - Key: Name
          Value: !Sub vulharness-php2shell-cloudformation-${DeploymentId}-sg

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: VulHarnessProject
          Value: !FindInMap [Constants, Values, Project]
        - Key: VulHarnessScenario
          Value: !FindInMap [Constants, Values, Scenario]
        - Key: VulHarnessEnvironment
          Value: !FindInMap [Constants, Values, Environment]
        - Key: VulHarnessDeployment
          Value: !Ref DeploymentId
        - Key: VulHarnessManagedBy
          Value: cloudformation
        - Key: VulHarnessDeploymentMethod
          Value: cloudformation
        - Key: VulHarnessOwner
          Value: !Ref Owner
        - Key: VulHarnessExpires
          Value: !Ref ExpiresAt
        - Key: VulHarnessResource
          Value: iam-role

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  LabCLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: t4g.small
        IamInstanceProfile:
          Name: !Ref InstanceProfile
        NetworkInterfaces:
          - DeviceIndex: '0'
            SubnetId: !Ref PublicSubnet
            Groups:
              - !Ref SecurityGroup
            AssociatePublicIpAddress: true
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2
          InstanceMetadataTags: disabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: VulHarnessProject
                Value: !FindInMap [Constants, Values, Project]
              - Key: VulHarnessScenario
                Value: !FindInMap [Constants, Values, Scenario]
              - Key: VulHarnessEnvironment
                Value: !FindInMap [Constants, Values, Environment]
              - Key: VulHarnessDeployment
                Value: !Ref DeploymentId
              - Key: VulHarnessManagedBy
                Value: cloudformation
              - Key: VulHarnessDeploymentMethod
                Value: cloudformation
              - Key: VulHarnessOwner
                Value: !Ref Owner
              - Key: VulHarnessExpires
                Value: !Ref ExpiresAt
              - Key: VulHarnessResource
                Value: instance
              - Key: VulHarnessLab
                Value: lab-c
              - Key: Name
                Value: !Sub vulharness-php2shell-lab-c-cloudformation-${DeploymentId}
          - ResourceType: volume
            Tags:
              - Key: VulHarnessProject
                Value: !FindInMap [Constants, Values, Project]
              - Key: VulHarnessScenario
                Value: !FindInMap [Constants, Values, Scenario]
              - Key: VulHarnessEnvironment
                Value: !FindInMap [Constants, Values, Environment]
              - Key: VulHarnessDeployment
                Value: !Ref DeploymentId
              - Key: VulHarnessManagedBy
                Value: cloudformation
              - Key: VulHarnessDeploymentMethod
                Value: cloudformation
              - Key: VulHarnessOwner
                Value: !Ref Owner
              - Key: VulHarnessExpires
                Value: !Ref ExpiresAt
              - Key: VulHarnessResource
                Value: volume
              - Key: VulHarnessLab
                Value: lab-c
              - Key: Name
                Value: !Sub vulharness-php2shell-lab-c-cloudformation-${DeploymentId}-root

  LabDLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: t4g.small
        IamInstanceProfile:
          Name: !Ref InstanceProfile
        NetworkInterfaces:
          - DeviceIndex: '0'
            SubnetId: !Ref PublicSubnet
            Groups:
              - !Ref SecurityGroup
            AssociatePublicIpAddress: true
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2
          InstanceMetadataTags: disabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: VulHarnessProject
                Value: !FindInMap [Constants, Values, Project]
              - Key: VulHarnessScenario
                Value: !FindInMap [Constants, Values, Scenario]
              - Key: VulHarnessEnvironment
                Value: !FindInMap [Constants, Values, Environment]
              - Key: VulHarnessDeployment
                Value: !Ref DeploymentId
              - Key: VulHarnessManagedBy
                Value: cloudformation
              - Key: VulHarnessDeploymentMethod
                Value: cloudformation
              - Key: VulHarnessOwner
                Value: !Ref Owner
              - Key: VulHarnessExpires
                Value: !Ref ExpiresAt
              - Key: VulHarnessResource
                Value: instance
              - Key: VulHarnessLab
                Value: lab-d
              - Key: Name
                Value: !Sub vulharness-php2shell-lab-d-cloudformation-${DeploymentId}
          - ResourceType: volume
            Tags:
              - Key: VulHarnessProject
                Value: !FindInMap [Constants, Values, Project]
              - Key: VulHarnessScenario
                Value: !FindInMap [Constants, Values, Scenario]
              - Key: VulHarnessEnvironment
                Value: !FindInMap [Constants, Values, Environment]
              - Key: VulHarnessDeployment
                Value: !Ref DeploymentId
              - Key: VulHarnessManagedBy
                Value: cloudformation
              - Key: VulHarnessDeploymentMethod
                Value: cloudformation
              - Key: VulHarnessOwner
                Value: !Ref Owner
              - Key: VulHarnessExpires
                Value: !Ref ExpiresAt
              - Key: VulHarnessResource
                Value: volume
              - Key: VulHarnessLab
                Value: lab-d
              - Key: Name
                Value: !Sub vulharness-php2shell-lab-d-cloudformation-${DeploymentId}-root

  LabCInstance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LabCLaunchTemplate
        Version: !GetAtt LabCLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: VulHarnessProject
          Value: !FindInMap [Constants, Values, Project]
        - Key: VulHarnessScenario
          Value: !FindInMap [Constants, Values, Scenario]
        - Key: VulHarnessEnvironment
          Value: !FindInMap [Constants, Values, Environment]
        - Key: VulHarnessDeployment
          Value: !Ref DeploymentId
        - Key: VulHarnessManagedBy
          Value: cloudformation
        - Key: VulHarnessDeploymentMethod
          Value: cloudformation
        - Key: VulHarnessOwner
          Value: !Ref Owner
        - Key: VulHarnessExpires
          Value: !Ref ExpiresAt
        - Key: VulHarnessResource
          Value: instance
        - Key: VulHarnessLab
          Value: lab-c

  LabDInstance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LabDLaunchTemplate
        Version: !GetAtt LabDLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: VulHarnessProject
          Value: !FindInMap [Constants, Values, Project]
        - Key: VulHarnessScenario
          Value: !FindInMap [Constants, Values, Scenario]
        - Key: VulHarnessEnvironment
          Value: !FindInMap [Constants, Values, Environment]
        - Key: VulHarnessDeployment
          Value: !Ref DeploymentId
        - Key: VulHarnessManagedBy
          Value: cloudformation
        - Key: VulHarnessDeploymentMethod
          Value: cloudformation
        - Key: VulHarnessOwner
          Value: !Ref Owner
        - Key: VulHarnessExpires
          Value: !Ref ExpiresAt
        - Key: VulHarnessResource
          Value: instance
        - Key: VulHarnessLab
          Value: lab-d

Outputs:
  DeploymentId:
    Value: !Ref DeploymentId
  VpcId:
    Value: !Ref VPC
  SubnetId:
    Value: !Ref PublicSubnet
  SecurityGroupId:
    Value: !Ref SecurityGroup
  LabCInstanceId:
    Value: !Ref LabCInstance
  LabDInstanceId:
    Value: !Ref LabDInstance
